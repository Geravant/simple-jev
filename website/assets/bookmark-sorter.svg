<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 412" width="500" height="412" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- background -->
  <rect width="500" height="412" fill="#e4e8ee"/>

  <!-- hanging rail -->
  <rect x="208" y="24" width="272" height="10" rx="5" fill="#3a423d"/>

  <!-- ribbon 1: orange / music -->
  <g>
    <path d="M226 29 H296 V268 L261 243 L226 268 Z" fill="#e5a060" stroke="#2f3632" stroke-width="4" stroke-linejoin="round"/>
    <rect x="226" y="29" width="70" height="14" fill="#2f3632" opacity=".12"/>
    <circle cx="261" cy="206" r="20" fill="#f7f5f0" stroke="#2f3632" stroke-width="3"/>
    <path d="M256 214 V196 L270 192 V210" fill="none" stroke="#2f3632" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="253" cy="214" r="4" fill="#2f3632"/>
    <circle cx="267" cy="210" r="4" fill="#2f3632"/>
  </g>

  <!-- ribbon 2: lime / travel -->
  <g>
    <path d="M314 29 H384 V330 L349 305 L314 330 Z" fill="#cdea72" stroke="#2f3632" stroke-width="4" stroke-linejoin="round"/>
    <rect x="314" y="29" width="70" height="14" fill="#2f3632" opacity=".12"/>
    <circle cx="349" cy="268" r="20" fill="#f7f5f0" stroke="#2f3632" stroke-width="3"/>
    <path d="M349 281 C 341 272, 339 267, 339 262 A10 10 0 0 1 359 262 C 359 267, 357 272, 349 281 Z" fill="none" stroke="#2f3632" stroke-width="3" stroke-linejoin="round"/><circle cx="349" cy="262" r="3.5" fill="#2f3632"/>
  </g>

  <!-- ribbon 3: yellow / coffee -->
  <g>
    <path d="M402 29 H472 V222 L437 197 L402 222 Z" fill="#e8c24e" stroke="#2f3632" stroke-width="4" stroke-linejoin="round"/>
    <rect x="402" y="29" width="70" height="14" fill="#2f3632" opacity=".12"/>
    <circle cx="437" cy="160" r="20" fill="#f7f5f0" stroke="#2f3632" stroke-width="3"/>
    <path d="M428 154 H444 V164 A6 6 0 0 1 438 170 H434 A6 6 0 0 1 428 164 Z" fill="none" stroke="#2f3632" stroke-width="3" stroke-linejoin="round"/>
    <path d="M444 157 H447 A3.5 3.5 0 0 1 447 164 H444" fill="none" stroke="#2f3632" stroke-width="2.5"/>
  </g>

  <!-- links already filed (small cards clipped onto ribbons) -->
  <g stroke="#2f3632" stroke-width="3" stroke-linejoin="round">
    <rect x="236" y="70" width="50" height="30" rx="6" fill="#f7f5f0"/>
    <rect x="324" y="112" width="50" height="30" rx="6" fill="#f7f5f0"/>
    <rect x="324" y="70" width="50" height="30" rx="6" fill="#f7f5f0"/>
    <rect x="412" y="70" width="50" height="30" rx="6" fill="#f7f5f0"/>
  </g>
  <g fill="#2f3632" opacity=".35">
    <rect x="244" y="80" width="30" height="4" rx="2"/><rect x="244" y="88" width="20" height="4" rx="2"/>
    <rect x="332" y="122" width="30" height="4" rx="2"/><rect x="332" y="130" width="22" height="4" rx="2"/>
    <rect x="332" y="80" width="30" height="4" rx="2"/><rect x="332" y="88" width="18" height="4" rx="2"/>
    <rect x="420" y="80" width="30" height="4" rx="2"/><rect x="420" y="88" width="24" height="4" rx="2"/>
  </g>

  <!-- empty slot on orange ribbon, waiting -->
  <rect x="236" y="112" width="50" height="30" rx="6" fill="none" stroke="#2f3632" stroke-width="2.5" stroke-dasharray="6 5"/>

  <!-- unsorted pile -->
  <g stroke="#2f3632" stroke-width="4" stroke-linejoin="round">
    <rect x="40" y="226" width="128" height="80" rx="10" fill="#f7f5f0" transform="rotate(-10 104 266)"/>
    <rect x="44" y="238" width="128" height="80" rx="10" fill="#f7f5f0" transform="rotate(6 108 278)"/>
    <rect x="38" y="250" width="128" height="80" rx="10" fill="#f7f5f0" transform="rotate(-3 102 290)"/>
  </g>
  <g transform="rotate(-3 102 290)">
    <circle cx="60" cy="272" r="8" fill="#cdea72" stroke="#2f3632" stroke-width="2.5"/>
    <rect x="76" y="268" width="66" height="7" rx="3.5" fill="#2f3632" opacity=".55"/>
    <rect x="52" y="292" width="98" height="6" rx="3" fill="#2f3632" opacity=".25"/>
    <rect x="52" y="306" width="70" height="6" rx="3" fill="#2f3632" opacity=".25"/>
  </g>

  <!-- trajectory from pile to empty slot -->
  <path d="M140 236 C 140 180, 170 150, 196 150" fill="none" stroke="#2f3632" stroke-width="3" stroke-dasharray="8 7" stroke-linecap="round"/>

  <!-- the link in flight -->
  <g transform="rotate(-16 196 150)">
    <rect x="160" y="128" width="72" height="44" rx="8" fill="#f7f5f0" stroke="#2f3632" stroke-width="4"/>
    <circle cx="176" cy="143" r="6" fill="#e5a060" stroke="#2f3632" stroke-width="2.5"/>
    <rect x="187" y="140" width="34" height="6" rx="3" fill="#2f3632" opacity=".55"/>
    <rect x="170" y="156" width="46" height="5" rx="2.5" fill="#2f3632" opacity=".25"/>
  </g>

    <!-- confidence tag -->
  <g>
    <rect x="150" y="84" width="58" height="26" rx="13" fill="#3a423d"/>
    <text x="179" y="102" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#cdea72">0.94</text>
  </g>
</svg>
